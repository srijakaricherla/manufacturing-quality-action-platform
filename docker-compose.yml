services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: quality
      POSTGRES_DB: quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - quality-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://quality:quality@postgres:5432/quality
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://quality:quality@postgres:5432/quality
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  quality-data:

